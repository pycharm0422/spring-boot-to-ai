<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive study book that takes Java developers from LLM basics to production AI.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>From Spring Boot to AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study book. A contents rail on the left and one chapter at a time in a ~66ch reading column; on phones the rail becomes a slide-in drawer. Key terms are marked with a highlighter, like a used textbook. */
:root{
  --paper:#F5F7F4; --surface:#FFFFFF; --ink:#17201C; --muted:#56635D; --line:#D9E0DB;
  --accent:#2445C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA;
  --mark:#FFE27A; --mark-ink:#17201C;
  --good:#1D7448; --good-soft:#E0F2E7; --bad:#B0281F; --bad-soft:#FBE5E2;
  --code-bg:#ECF0ED; --code-ink:#1E2B26; --chip:#E7ECE8;
  --t1:#DCE6FB; --t2:#FBE3CF; --t3:#DBF0E1; --t4:#F1DDF2;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --rail:288px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111614; --surface:#18201D; --ink:#E4EBE7; --muted:#9AA7A1; --line:#2B3531;
  --accent:#8FA6FF; --accent-ink:#0D1430; --accent-soft:#1F2748;
  --mark:#5E5214; --mark-ink:#FFF6CC;
  --good:#63D29B; --good-soft:#16301F; --bad:#FF8B80; --bad-soft:#3A1C19;
  --code-bg:#0C110F; --code-ink:#D5E2DB; --chip:#222C28;
  --t1:#22325A; --t2:#4A3220; --t3:#1E3E2A; --t4:#40244A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --surface:#18201D; --ink:#E4EBE7; --muted:#9AA7A1; --line:#2B3531;
  --accent:#8FA6FF; --accent-ink:#0D1430; --accent-soft:#1F2748;
  --mark:#5E5214; --mark-ink:#FFF6CC;
  --good:#63D29B; --good-soft:#16301F; --bad:#FF8B80; --bad-soft:#3A1C19;
  --code-bg:#0C110F; --code-ink:#D5E2DB; --chip:#222C28;
  --t1:#22325A; --t2:#4A3220; --t3:#1E3E2A; --t4:#40244A; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.84em;background:var(--code-bg);color:var(--code-ink);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
mark.t{background:linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%);color:var(--mark-ink);padding:0 .1em}

/* ---------- rail ---------- */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.rail-head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:4px}
.overall{margin-top:14px;display:grid;gap:6px}
.overall-row{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.rail-nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.phase-label{font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.nav-item{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-display);font-size:14.5px;line-height:1.3}
.nav-item:hover{background:var(--paper)}
.nav-item[aria-current="page"]{background:var(--accent-soft)}
.nav-item .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px;padding-top:1px}
.nav-item .sub{display:block;font-family:var(--f-body);font-size:12.5px;color:var(--muted);margin-top:2px}
.nav-item .sub.done{color:var(--good)}
.nav-item.locked{cursor:default;opacity:.55}
.nav-item.locked:hover{background:none}
.rail-foot{border-top:1px solid var(--line);padding:12px 20px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}

/* ---------- top bar (phones) ---------- */
.topbar{display:none}
.scrim{display:none}

/* ---------- main ---------- */
main{margin-left:var(--rail);padding-inline:32px;padding-block:48px 96px}
.read{max-width:42rem;margin:0 auto}
.read>*+*{margin-top:0}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(2.1rem,5vw,3.1rem);line-height:1.05;font-weight:800;margin:0 0 16px}
.lead{font-size:1.15rem;color:var(--muted);margin:0 0 20px}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.meta span{background:var(--chip);border-radius:999px;padding:3px 10px}
.learn{margin:32px 0 8px;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.label{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.learn ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.learn button{background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;display:grid;grid-template-columns:2.6rem 1fr;width:100%;font-size:15.5px}
.learn button:hover span:last-child{text-decoration:underline;text-underline-offset:3px}
.learn .n{font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.sec{padding-top:40px}
.sec h2{font-size:1.6rem;line-height:1.15;margin:0 0 14px;display:flex;gap:12px;align-items:baseline}
.secnum{font-size:1rem;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.sec h3{font-size:1.12rem;margin:26px 0 6px}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.3rem}
.sec li{margin:4px 0}
.sec li::marker{color:var(--muted)}

.note{margin:18px 0;padding:14px 18px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.note p:last-child,.note ul:last-child{margin-bottom:0}
.note .tag{display:inline-block;font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.note.java .tag{color:var(--accent)}
.note.analogy .tag{color:var(--muted)}
.note.warn{background:var(--bad-soft);border-color:transparent}
.note.warn .tag{color:var(--bad)}

.codebox{margin:16px 0;border-radius:10px;background:var(--code-bg);border:1px solid var(--line);overflow:hidden}
.codebox .cap{font-family:var(--f-display);font-size:12px;color:var(--muted);padding:8px 14px 0;letter-spacing:.02em}
.codebox pre{margin:0;padding:10px 14px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;color:var(--code-ink);tab-size:4}

.tablewrap{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
th{font-family:var(--f-display);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 12px 8px 0;border-bottom:1.5px solid var(--ink)}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* generation strip */
.gen{display:grid;gap:8px;margin:18px 0;padding:16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:13.5px}
.gen-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gen-step{font-family:var(--f-display);font-size:12px;color:var(--muted);width:4.2rem;flex:none}
.tok{display:inline-block;padding:2px 6px;border-radius:5px;background:var(--chip);white-space:pre}
.tok.new{background:var(--mark);color:var(--mark-ink);font-weight:600}

/* checks */
.check{margin:26px 0;padding:18px 18px 16px;border-radius:12px;border:1.5px solid var(--accent);background:var(--surface)}
.check .label{color:var(--accent)}
.check-q{margin:0 0 12px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:15.5px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt .k{font-family:var(--f-display);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--muted)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.feedback{margin-top:12px;font-size:15px}
.feedback strong{font-family:var(--f-display)}
.feedback .ok{color:var(--good)}
.feedback .no{color:var(--bad)}
.feedback p{margin:4px 0 8px}

/* demos */
.demo{margin:22px 0;padding:18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.demo h4{font-family:var(--f-display);font-size:1rem;margin:0 0 4px}
.demo .hint{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.demo textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);font-family:var(--f-mono);font-size:14px;resize:vertical}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chipbtn{background:var(--chip);border:0;border-radius:999px;padding:4px 11px;font-family:var(--f-display);font-size:13px;cursor:pointer}
.chipbtn:hover{background:var(--accent-soft)}
.toks{display:flex;flex-wrap:wrap;gap:3px;font-family:var(--f-mono);font-size:13.5px;line-height:1.3;max-height:220px;overflow-y:auto}
.toks .tok:nth-child(4n+1){background:#DCE6FB}.toks .tok:nth-child(4n+2){background:#FBE3CF}.toks .tok:nth-child(4n+3){background:#DBF0E1}.toks .tok:nth-child(4n){background:#F1DDF2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toks .tok:nth-child(4n+1){background:#22325A}:root:not([data-theme="light"]) .toks .tok:nth-child(4n+2){background:#4A3220}:root:not([data-theme="light"]) .toks .tok:nth-child(4n+3){background:#1E3E2A}:root:not([data-theme="light"]) .toks .tok:nth-child(4n){background:#40244A}}
:root[data-theme="dark"] .toks .tok:nth-child(4n+1){background:#22325A}:root[data-theme="dark"] .toks .tok:nth-child(4n+2){background:#4A3220}:root[data-theme="dark"] .toks .tok:nth-child(4n+3){background:#1E3E2A}:root[data-theme="dark"] .toks .tok:nth-child(4n){background:#40244A}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.prompt-line{font-family:var(--f-mono);font-size:14px;margin:0 0 12px}
.prompt-line span{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:3px}
.slider{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-family:var(--f-display);font-size:14px}
.slider input{flex:1;min-width:160px;accent-color:var(--accent)}
.slider output{font-variant-numeric:tabular-nums;font-weight:700;min-width:3.2rem}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:6.5rem 1fr 3.4rem;gap:10px;align-items:center;font-size:14px}
.barrow .w{font-family:var(--f-mono);font-size:13.5px}
.barrow .track{height:16px;background:var(--chip);border-radius:4px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.barrow .p{font-family:var(--f-display);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.samples{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;min-height:28px;align-items:center;font-family:var(--f-mono);font-size:13px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.calc label{display:grid;gap:4px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.calc input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-family:var(--f-mono);font-size:15px;width:100%;min-width:0}
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.calc-out div{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.calc-out b{display:block;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}

/* flows */
.flow{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:14px}
.flow-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow-label{width:100%;font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fbox{border:1.25px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--f-display);font-size:13.5px;line-height:1.3;background:var(--paper)}
.fbox.key{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.farrow{color:var(--muted);font-family:var(--f-display)}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.barrow.wide{grid-template-columns:minmax(0,1fr) minmax(4rem,30%) 2.8rem}
.barrow.wide .w{font-family:var(--f-body);font-size:14px;line-height:1.35}
.barrow.wide .w small{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.calc input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.chunks{display:grid;gap:8px;max-height:440px;overflow-y:auto}
.chunk{padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.5;background:var(--t1);white-space:pre-wrap}
.chunk:nth-child(4n+2){background:var(--t2)}.chunk:nth-child(4n+3){background:var(--t3)}.chunk:nth-child(4n){background:var(--t4)}
.chunk .cn{display:block;font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:normal}
.chunk u{text-decoration:underline 2px var(--accent);text-underline-offset:3px}

/* terms */
.terms{margin-top:48px;padding-top:28px;border-top:1.5px solid var(--ink)}
.terms h2,.test-wrap h2{font-size:1.5rem;margin:0 0 14px}
dl{margin:0;display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:10px 18px;font-size:15.5px}
dt{font-family:var(--f-display);font-weight:700}
dd{margin:0;color:var(--muted)}

/* tests */
.test-wrap{margin-top:48px;padding:24px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.test-wrap>p{margin:0 0 6px}
.prev-score{font-family:var(--f-display);font-size:13.5px;color:var(--muted);margin:0 0 16px}
.test fieldset{border:0;margin:0;padding:18px 0;border-top:1px solid var(--line);min-width:0}
.test legend{font-weight:600;padding:0;margin-bottom:10px;display:grid;grid-template-columns:2rem 1fr;width:100%}
.test legend .qn{font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.topts{display:grid;gap:6px;padding-left:2rem}
.topt{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:15.5px;line-height:1.45}
.topt input{margin:4px 0 0;accent-color:var(--accent)}
.topt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tq.done .topt{cursor:default}
.topt.is-answer{border-color:var(--good);background:var(--good-soft)}
.topt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.tq .why{padding-left:2rem;margin:10px 0 0;font-size:15px}
.tq .why b{font-family:var(--f-display)}
.tq.right .why b{color:var(--good)} .tq.wrong .why b{color:var(--bad)}
.test-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.test-msg{margin:0;font-size:14.5px;color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-family:var(--f-display);font-weight:700;font-size:14.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 11px;font-size:13px}
.result{margin:0 0 18px;padding:16px 18px;border-radius:10px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.result.pass{background:var(--good-soft)} .result.fail{background:var(--bad-soft)}
.result .score{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.result.pass .score{color:var(--good)} .result.fail .score{color:var(--bad)}
.result p{margin:0;flex:1;min-width:14rem;font-size:15.5px}

/* written + practical */
.written{margin:20px 0;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.written p.q{font-weight:600;margin:0 0 10px}
.written textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);font-size:15.5px;line-height:1.55;resize:vertical}
.written .model{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--good-soft);font-size:15.5px}
.written .model p{margin:0 0 8px}.written .model p:last-child{margin:0}
.saved{font-family:var(--f-display);font-size:12.5px;color:var(--muted);margin-left:10px}
.checklist{list-style:none;padding:0;margin:14px 0;display:grid;gap:6px}
.checklist label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:15.5px;line-height:1.45}
.checklist input{margin:4px 0 0;accent-color:var(--good)}
.checklist label:has(input:checked){background:var(--good-soft);border-color:var(--good)}
.part{margin-top:44px}
.part h2{font-size:1.6rem;margin:0 0 8px}
.part>p{margin:0 0 12px}

/* chapter nav */
.chnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px}

java: String.raw`import java.net.URI;
import java.net.http.HttpClient;
import java.net.http.HttpRequest;
import java.net.http.HttpResponse;
import java.time.Duration;

public class AskLlm {

    private static final HttpClient CLIENT = HttpClient.newBuilder()
            .connectTimeout(Duration.ofSeconds(10))
            .build();

    public static void main(String[] args) throws Exception {
        String apiKey = System.getenv("ANTHROPIC_API_KEY");   // never hard-code keys
        if (apiKey == null) {
            throw new IllegalStateException("Set ANTHROPIC_API_KEY first");
        }

        String body = """
            {
              "model": "MODEL_NAME",
              "max_tokens": 300,
              "messages": [
                {"role": "user", "content": "Explain Java records in two lines."}
              ]
            }
            """;

        HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("https://api.anthropic.com/v1/messages"))
                .timeout(Duration.ofSeconds(60))
                .header("content-type", "application/json")
                .header("x-api-key", apiKey)
                .header("anthropic-version", "2023-06-01")
                .POST(HttpRequest.BodyPublishers.ofString(body))
                .build();

        HttpResponse<String> response =
                CLIENT.send(request, HttpResponse.BodyHandlers.ofString());

        System.out.println("Status: " + response.statusCode());
        System.out.println(response.body());   // parse with Jackson in real code
    }
}`,

stream: String.raw`// Same request as before, but the JSON body also contains  "stream": true
HttpResponse<java.util.stream.Stream<String>> response =

response.body()

            JsonNode node = mapper.readTree(json); // Jackson ObjectMapper

backoff: String.raw`int maxAttempts = 4;
for (int attempt = 0; attempt < maxAttempts; attempt++) {
    HttpResponse<String> res = CLIENT.send(request, HttpResponse.BodyHandlers.ofString());
    int code = res.statusCode();

    if (code < 400) return res.body();                    // success
    boolean retryable = code == 429 || code >= 500;       // rate limit or server trouble
    if (!retryable || attempt == maxAttempts - 1) {
        throw new LlmCallException(code, res.body());     // 400/401/413: fix, don't retry
    }

    long waitMs = 1000L * (1L << attempt);                // 1s, 2s, 4s ...
    waitMs += ThreadLocalRandom.current().nextLong(0, waitMs / 2 + 1); // jitter
    String retryAfter = res.headers().firstValue("retry-after").orElse(null);
    if (retryAfter != null) {
        waitMs = Math.max(waitMs, Long.parseLong(retryAfter) * 1000L); // server knows best
    }
    Thread.sleep(waitMs);
}`,

const PHASES = {1:"Foundations",2:"LLM features in Spring Boot",3:"Your data: RAG, agents and MCP",4:"Production-grade AI"};

const CHAPTERS = [
{ id:"ch1", n:1, phase:1, title:"How LLMs work", mins:40,
  lead:"A language model writes by predicting the next small piece of text, over and over. Once that idea clicks, token costs, hallucination and the need for RAG all make sense.",
  sections:[
  { t:"What an LLM actually is", h:`
<p>A <mark class="t">large language model (LLM)</mark> is a program trained on a huge amount of text, such as books, websites and code, to do one job: look at some text and predict what comes next.</p>
<div class="note analogy"><span class="tag">Analogy</span><p>Think of your phone keyboard's next-word suggestions. An LLM is the same idea, trained on vastly more text, and able to look at thousands of words at once instead of the last two.</p></div>
<p>When you ask a question, the model does not search a database. It writes one small piece of text, adds it to the end, and predicts again. It keeps looping until it decides the answer is finished or hits a length limit. This loop is called <mark class="t">generation</mark>.</p>
<div class="gen" aria-label="Generation, one token at a time">
  <div class="gen-row"><span class="gen-step">Step 1</span><span class="tok">Java records are</span><span class="tok new"> immutable</span></div>
  <div class="gen-row"><span class="gen-step">Step 2</span><span class="tok">Java records are immutable</span><span class="tok new"> data</span></div>
  <div class="gen-row"><span class="gen-step">Step 3</span><span class="tok">Java records are immutable data</span><span class="tok new"> carriers</span></div>
  <div class="gen-row"><span class="gen-step">Step 4</span><span class="tok">Java records are immutable data carriers</span><span class="tok new">.</span></div>
</div>
<p>Why does it seem smart? To predict text well across billions of examples, the model had to pick up grammar, facts, coding patterns and some reasoning. All of that is stored as <mark class="t">weights</mark>: billions of numbers set during training. It is pattern knowledge, not a table of facts it can look up.</p>
<div class="note java"><span class="tag">In Java terms</span><p>Picture a huge, read-only function: <code>Token next(List&lt;Token&gt; context)</code>. Your app calls it in a loop, appending each result, until it returns an end marker.</p></div>
<div data-quiz="c1a"></div>`},
  { t:"Tokens", h:`
<p>Models don't read letters or whole words. They read <mark class="t">tokens</mark>: chunks of text chosen by a <mark class="t">tokenizer</mark>. Common words are often a single token. Rare or long words are split into pieces, so "tokenization" may become "token" + "ization". Spaces usually attach to the start of the next word.</p>
<p>Useful rules of thumb for English text:</p>
<ul>
<li>1 token is about 4 characters, or about ¾ of a word.</li>
<li>100 tokens is about 75 words; 1,000 words is about 1,300 tokens.</li>
<li>Code, JSON and many non-English languages, including Hindi, use more tokens for the same meaning.</li>
</ul>
<p>Why you should care:</p>
<ul>
<li><b>Limits</b> are counted in tokens: how much the model can read, and how long its answer can be.</li>
<li><b>Price</b> is counted in tokens: you pay per token you send and per token you get back.</li>
<li><b>Speed</b> depends on tokens: the answer is produced one token at a time, so a long answer takes longer.</li>
</ul>
<div data-demo="tokens"></div>
<div data-quiz="c1b"></div>`},
  { t:"How the model picks the next token", h:`
<p>At every step the model gives a score to every token in its vocabulary, which can be 100,000 tokens or more. The scores are turned into <mark class="t">probabilities</mark> that add up to 100%. Then one token is picked.</p>
<p><mark class="t">Temperature</mark> controls how that pick is made:</p>
<ul>
<li><b>Low temperature</b> sharpens the odds, so the top choice wins almost every time. Output is predictable and repeatable.</li>
<li><b>High temperature</b> flattens the odds, so less likely tokens get picked more often. Output is more varied and creative, and more likely to wander off.</li>
<li><b>Temperature 0</b> means "almost always take the top token". It is close to repeatable, but providers don't promise identical output on every call.</li>
</ul>
<p>Move the slider below to see the real calculation. The scores are made up for the example, but the maths is the same one models use.</p>
<div data-demo="temp"></div>
<p><mark class="t">Top-p</mark> (also called nucleus sampling) is a second dial. With top-p = 0.9, the model only picks from the smallest group of top tokens whose probabilities add up to 90%, which cuts off the long tail of odd choices. Usually you adjust temperature or top-p, not both.</p>
<div class="tablewrap"><table>
<thead><tr><th>Task</th><th>Temperature</th><th>Why</th></tr></thead>
<tbody>
<tr><td>Extracting fields, classifying, generating code</td><td>Low (0 to 0.3)</td><td>You want the same, correct answer every time</td></tr>
<tr><td>Explanations, general chat</td><td>The provider's default</td><td>A natural balance</td></tr>
<tr><td>Brainstorming, taglines, story ideas</td><td>Higher</td><td>You want variety</td></tr>
</tbody></table></div>
<p>Ranges differ by provider (for example 0 to 1 on some APIs and 0 to 2 on others), so check the docs.</p>
<div data-quiz="c1c"></div>`},
  { t:"How models are trained", h:`
<p>Training happens in two broad stages.</p>
<ol>
<li><b>Pretraining.</b> The model reads an enormous amount of text and learns to predict the next token. The result is a <mark class="t">base model</mark>: it continues text well but doesn't reliably follow instructions.</li>
<li><b>Post-training.</b> The model is trained on examples of good assistant answers, then on preferences between answers, so it learns to be helpful, follow instructions and refuse harmful requests. This includes methods such as RLHF (reinforcement learning from human feedback). The result is the chat model you actually use.</li>
</ol>
<p>Training stops at a date called the <mark class="t">knowledge cutoff</mark>. The model knows nothing after it unless you put that information in the prompt or give it a tool, such as web search or your own API.</p>
<div class="note warn"><span class="tag">Watch out</span><p>Your conversations don't train the model while you use it. The weights are frozen. If the model "learned" something earlier in a chat, it is only because that text is still in the request.</p></div>`},
  { t:"Context window and memory", h:`
<p>The <mark class="t">context window</mark> is the maximum number of tokens the model can look at in one call. Everything counts: the system instructions, the chat history, any documents, and the answer it writes. Many current models handle hundreds of thousands of tokens, and some handle a million or more.</p>
<p>Bigger isn't free. You pay for every token you send, long requests are slower, and models can miss details buried in the middle of very long inputs.</p>
<p>The model is also <mark class="t">stateless</mark>: every call starts fresh, with no memory of the last one. A chat app seems to remember because it sends the whole conversation again with each new message.</p>
<div class="tablewrap"><table>
<thead><tr><th>Turn</th><th>What the app sends</th><th class="num">Input tokens (example)</th></tr></thead>
<tbody>
<tr><td>1</td><td>System + question 1</td><td class="num">300</td></tr>
<tr><td>2</td><td>System + Q1 + answer 1 + question 2</td><td class="num">900</td></tr>
<tr><td>3</td><td>System + Q1 + A1 + Q2 + A2 + question 3</td><td class="num">1,500</td></tr>
</tbody></table></div>
<p>So long chats cost more on every turn. Eventually the app must trim old messages or replace them with a summary, which is why a chatbot can "forget" the start of a long conversation.</p>
<div class="note java"><span class="tag">In Java terms</span><p>It works like a stateless REST endpoint. Session state lives in your application (a database or Redis), and you send what the model needs with every request.</p></div>
<div data-quiz="c1d"></div>`},
  { t:"Hallucination", h:`
<p>A <mark class="t">hallucination</mark> is a fluent, confident answer that is false: a Spring property that doesn't exist, a made-up library method, a fake citation, a wrong number.</p>
<p>It happens because the model is trained to produce <i>likely-sounding</i> text, not to check facts. When it doesn't know, the most likely-sounding continuation is still an answer, rarely "I don't know". Rare facts, such as a niche library's settings, are stored weakly, so they are the most likely to be wrong.</p>
<p>How to reduce it:</p>
<ul>
<li><b>Give it the facts.</b> Put the relevant documents or data in the prompt. This is called <mark class="t">grounding</mark>, and RAG (Chapter 8) does it automatically.</li>
<li><b>Allow "I don't know".</b> Say so explicitly in the instructions.</li>
<li><b>Ask for sources.</b> Have it quote the passage each claim comes from.</li>
<li><b>Lower the temperature</b> for factual tasks.</li>
<li><b>Verify with code.</b> Compile it, run the tests, check the value against a real API. Trust, but verify every time.</li>
</ul>
<div class="note warn"><span class="tag">Watch out</span><p>In coding, invented package names are dangerous. The compiler catches a wrong method, but a made-up dependency name might match a real, malicious package someone published on purpose. Check every new dependency.</p></div>`},
  { t:"Three ways to adapt a model", h:`
<p>When a model doesn't do what you need out of the box, you have three tools. Try them in this order.</p>
<div class="tablewrap"><table>
<thead><tr><th>Approach</th><th>What it changes</th><th>Good for</th><th>Effort</th></tr></thead>
<tbody>
<tr><td><b>Prompting</b></td><td>The instructions and examples in each request</td><td>Format, tone, most everyday tasks</td><td>Minutes, almost free</td></tr>
<tr><td><b>RAG</b></td><td>Adds relevant documents to the prompt at question time</td><td>Private or changing knowledge, answers with citations</td><td>Days; needs a search index</td></tr>
<tr><td><b>Fine-tuning</b></td><td>Trains the model's weights further on your examples</td><td>A very consistent style or narrow behaviour at large scale</td><td>Weeks; needs good data and redoing when models change</td></tr>
</tbody></table></div>
<p>A common mistake is fine-tuning to teach a model facts. Facts change, and a fine-tuned model can't cite where an answer came from. For knowledge, use RAG.</p>
<div data-quiz="c1e"></div>`},
  { t:"Choosing a model size", h:`
<p>Providers usually offer a family of models, from large to small.</p>
<ul>
<li><b>Large models</b> reason better, write better code and handle long, messy documents. They are slower and cost more per token.</li>
<li><b>Small models</b> are fast and cheap. They are often good enough for classification, extracting fields, routing and simple questions.</li>
</ul>
<p>A common design uses both: a small model handles easy, high-volume steps, and hard cases go to a large one. Never choose by reputation alone. Test candidates on 30 to 50 of your own real examples and compare quality, speed and cost. Chapter 11 shows how.</p>`}
  ],
  terms:[["LLM","A model trained to predict the next token of text."],["Token","A chunk of text, about 4 characters of English."],["Context window","The most tokens a model can handle in one call, input and output together."],["Temperature","How random the choice of the next token is."],["Top-p","Only pick from the top tokens that together reach probability p."],["Knowledge cutoff","The date after which the model has no training data."],["Stateless","Each call is independent; history must be resent."],["Hallucination","A confident, fluent answer that is false."],["Grounding","Giving the model the facts it should answer from."],["Fine-tuning","Further training a model's weights on your own examples."]],
  test:"t1" },

{ id:"ch2", n:2, phase:1, title:"Prompting", mins:35,
  lead:"The prompt is the only way you program a model. Good prompts are specific, give context, and say exactly what the output should look like.",
  sections:[
  { t:"Messages and roles", h:`
<p>A chat API takes a list of <mark class="t">messages</mark>, each with a role:</p>
<ul>
<li><b>System</b>: standing instructions for the whole conversation, such as who the assistant is, the rules and the format. Some APIs have a separate <code>system</code> field; others use a first message with role "system".</li>
<li><b>User</b>: what the person (or your code) is asking.</li>
<li><b>Assistant</b>: the model's earlier replies, which you send back so it can see the conversation so far.</li>
</ul>
<div class="codebox"><div class="cap">A conversation as the API sees it</div><pre data-code="messages"></pre></div>
<div class="note java"><span class="tag">In Java terms</span><p>The system prompt is like application configuration: set once, applies to every request. The user message is like the request body.</p></div>
<div data-quiz="c2a"></div>`},
  { t:"The anatomy of a good prompt", h:`
<p>Most strong prompts have five parts:</p>
<ol>
<li><b>Task</b>: what to do, in one clear sentence.</li>
<li><b>Context</b>: who the output is for and why.</li>
<li><b>Input</b>: the data to work on, clearly marked.</li>
<li><b>Constraints</b>: length, rules, edge cases.</li>
<li><b>Output format</b>: exactly what the answer should look like.</li>
</ol>
<div class="codebox"><div class="cap">Weak prompt</div><pre data-code="weak"></pre></div>
<div class="codebox"><div class="cap">Strong prompt</div><pre data-code="strong"></pre></div>
<p>The strong version names the reader and the device, sets a length, says which details matter, and handles one edge case (missing steps). The model no longer has to guess any of these.</p>
<h3>Three habits that help</h3>
<ul>
<li><b>The new-colleague test.</b> Would a smart colleague who has never seen your project know exactly what to do from this prompt alone? The model knows nothing about your project except what you write.</li>
<li><b>Say what to do, not only what not to do.</b> "Write in plain paragraphs" works better than "Don't use markdown".</li>
<li><b>Give the reason.</b> "Under 60 words, because it is shown in a phone notification" helps the model make sensible choices in cases your rules don't cover.</li>
</ul>`},
  { t:"Marking your data with delimiters", h:`
<p>When you paste in data such as an email, a document or user input, wrap it in clear markers. XML-style tags like <code>&lt;email&gt;…&lt;/email&gt;</code> work well; so do triple quotes.</p>
<ul>
<li>The model can tell your <b>instructions</b> apart from the <b>data</b>.</li>
<li>You can refer to the data by name: "Summarise the text in &lt;email&gt;".</li>
<li>Instructions hidden in pasted text are less likely to be obeyed. This is a first defence against <mark class="t">prompt injection</mark>, though not a complete one (Chapter 13).</li>
</ul>
<p>With long documents, put the documents first and your question or instructions at the end. Models tend to answer better that way.</p>
<div data-quiz="c2b"></div>`},
  { t:"Few-shot examples", h:`
<p>A <mark class="t">zero-shot</mark> prompt gives only instructions. A <mark class="t">few-shot</mark> prompt also includes two to five worked examples of input and the output you want. Models copy patterns strongly, so examples are often the fastest way to fix format and tone.</p>
<div class="codebox"><div class="cap">Few-shot classification prompt</div><pre data-code="fewshot"></pre></div>
<ul>
<li><b>Vary the examples</b>: different categories, lengths and wording. If every example looks alike, the model over-copies.</li>
<li><b>Include one tricky case</b>, such as a ticket that mentions two topics.</li>
<li><b>Keep examples consistent</b> with your written rules, or the model won't know which to follow.</li>
</ul>
<div data-quiz="c2c"></div>`},
  { t:"Letting the model think", h:`
<p>For multi-step problems such as maths, logic, debugging or weighing options, asking the model to reason step by step before answering improves accuracy. It works because each written step becomes context for the next one.</p>
<p>Many current models also have a built-in reasoning or "extended thinking" mode you switch on through the API, which does this without prompt tricks.</p>
<p>A simple manual pattern: "First think through the problem inside &lt;thinking&gt; tags. Then give only the final answer inside &lt;answer&gt; tags." Your code then reads just the &lt;answer&gt; part.</p>
<div class="note warn"><span class="tag">Watch out</span><p>Thinking costs extra tokens and time. Don't switch it on for simple lookups or field extraction.</p></div>`},
  { t:"Structured output", h:`
<p>Applications need data, not prose. Ask for JSON with an exact shape, show that shape, and say "Return only the JSON".</p>
<div class="codebox"><div class="cap">Prompt asking for JSON</div><pre data-code="json"></pre></div>
<p>Many APIs also offer a <mark class="t">structured output</mark> mode where you pass a JSON schema and the provider guarantees the shape. Use it when it is available.</p>
<p>Either way, always parse and validate in your own code, and decide what happens when it fails: usually retry once, then fall back.</p>
<div class="codebox"><div class="cap">Mapping the answer to a Java record</div><pre data-code="record"></pre></div>
<div data-quiz="c2d"></div>`},
  { t:"Treat prompts like code", h:`
<p>Prompts are part of your program, so manage them the same way:</p>
<ul>
<li>Keep them in versioned template files, not scattered string literals.</li>
<li>Change one thing at a time.</li>
<li>Keep a set of test inputs and rerun them after every change. Chapter 11 turns this into proper evals.</li>
<li>Log which prompt version produced each answer, so you can trace problems.</li>
</ul>
<div class="tablewrap"><table>
<thead><tr><th>Common mistake</th><th>Fix</th></tr></thead>
<tbody>
<tr><td>Vague task: "Summarise this"</td><td>Name the reader, the length and the format</td></tr>
<tr><td>Only "don't" rules</td><td>Say what to do instead</td></tr>
<tr><td>A wall of 40 rules</td><td>Keep the ones that matter and give reasons</td></tr>
<tr><td>Examples that all look the same</td><td>Vary them and include a tricky case</td></tr>
<tr><td>Trusting the output format</td><td>Validate in code and handle failures</td></tr>
<tr><td>Prompt text spread across classes</td><td>One versioned template per prompt</td></tr>
</tbody></table></div>`}
  ],
  terms:[["System prompt","Standing instructions that apply to the whole conversation."],["Delimiters","Markers such as XML tags that separate data from instructions."],["Zero-shot","A prompt with instructions only."],["Few-shot","A prompt that includes a few worked examples."],["Extended thinking","A mode where the model reasons before answering."],["Structured output","Getting machine-readable output, such as JSON, in a fixed shape."],["Prompt injection","Text in the input that tries to override your instructions."]],
  test:"t2" },

{ id:"ch3", n:3, phase:1, title:"Calling an LLM API", mins:40,
  lead:"Calling a model is a normal HTTPS request. If you have called a REST API from Spring, you already know most of this chapter.",
  sections:[
  { t:"The request", h:`
<p>You send a POST request with a JSON body to the provider's endpoint, and put your API key in a header. The examples here use the shape of the Claude API. OpenAI and Google name some fields differently, but the ideas are identical.</p>
<div class="codebox"><div class="cap">Request body</div><pre data-code="request"></pre></div>
<div class="tablewrap"><table>
<thead><tr><th>Field</th><th>What it does</th></tr></thead>
<tbody>
<tr><td><code>model</code></td><td>Which model to use. Copy a current model name from the provider's docs.</td></tr>
<tr><td><code>max_tokens</code></td><td>A hard cap on the answer's length. You pay for tokens actually generated, not for the cap.</td></tr>
<tr><td><code>system</code></td><td>Standing instructions (Chapter 2).</td></tr>
<tr><td><code>messages</code></td><td>The conversation so far, oldest first.</td></tr>
<tr><td><code>temperature</code></td><td>Optional; how random the output is (Chapter 1).</td></tr>
<tr><td><code>stream</code></td><td>Optional; <code>true</code> sends the answer piece by piece.</td></tr>
</tbody></table></div>`},
  { t:"The response", h:`
<div class="codebox"><div class="cap">Response body</div><pre data-code="response"></pre></div>
<ul>
<li><b><code>content</code></b> is a list of blocks. For now it holds text; in Chapter 6 it will also hold tool requests.</li>
<li><b><code>stop_reason</code></b> says why the model stopped. <code>end_turn</code> means it finished naturally. <code>max_tokens</code> means it was cut off, so raise the limit or ask for a shorter answer.</li>
<li><b><code>usage</code></b> gives the input and output token counts. Log these on every call: they are your cost and your early warning when prompts grow.</li>
</ul>
<div data-quiz="c3a"></div>`},
  { t:"Calling it from Java", h:`
<p>Here is the whole call with Java's built-in <code>HttpClient</code> and no framework. Doing it once by hand makes it much easier to debug a framework later.</p>
<div class="codebox"><div class="cap">AskLlm.java (Java 17)</div><pre data-code="java"></pre></div>
<ul>
<li>Replace <code>MODEL_NAME</code> with a current model ID from the provider's docs.</li>
<li>In real code, build and read the JSON with Jackson instead of strings.</li>
<li>Create one <code>HttpClient</code> and reuse it; it manages connections for you.</li>
<li>Always set timeouts. A call with no timeout can hang a thread for minutes.</li>
</ul>
<div class="note java"><span class="tag">In Spring</span><p>In a Spring Boot service you would use <code>RestClient</code> or <code>WebClient</code>. In Chapter 5, Spring AI wraps all of this in a <code>ChatClient</code>.</p></div>`},
  { t:"Streaming", h:`
<p>Without streaming, the user stares at a spinner until the whole answer is ready, which can take 10 to 30 seconds for a long one. With <code>"stream": true</code>, the server sends the answer as <mark class="t">server-sent events (SSE)</mark>: the HTTP response stays open and the server writes small <code>data:</code> lines as tokens are produced.</p>
<div class="codebox"><div class="cap">What a streamed response looks like</div><pre data-code="sse"></pre></div>
<div class="codebox"><div class="cap">Reading the stream in Java</div><pre data-code="stream"></pre></div>
<p>There are two latency numbers to watch. <mark class="t">Time to first token</mark> is what users feel. <b>Total time</b> is how long the full answer takes. Streaming improves the first, not the second.</p>
<div data-quiz="c3b"></div>`},
  { t:"Working out the cost", h:`
<p>Providers charge per million tokens, with separate prices for input and output. Output usually costs several times more than input.</p>
<p><b>Cost of one call</b> = input tokens ÷ 1,000,000 × input price + output tokens ÷ 1,000,000 × output price.</p>
<div data-demo="cost"></div>
<p>Ways to bring it down:</p>
<ul>
<li>Shorter prompts and fewer pasted documents.</li>
<li>A sensible <code>max_tokens</code>, and asking for concise answers.</li>
<li>A smaller model for easy tasks.</li>
<li><mark class="t">Prompt caching</mark>: when many requests start with the same long text (a system prompt, a manual), providers can cache it and charge much less for that part.</li>
<li>Caching whole answers to questions that repeat.</li>
</ul>`},
  { t:"Errors, retries and timeouts", h:`
<div class="tablewrap"><table>
<thead><tr><th>Status</th><th>Meaning</th><th>Retry?</th></tr></thead>
<tbody>
<tr><td>400</td><td>Bad request: wrong field, invalid JSON</td><td>No. Fix the code.</td></tr>
<tr><td>401 / 403</td><td>Missing or wrong key, or no permission</td><td>No. Check the key.</td></tr>
<tr><td>413</td><td>Request too large</td><td>No. Send less.</td></tr>
<tr><td>429</td><td>Rate limited: too many requests or tokens</td><td>Yes, after waiting. Respect the <code>retry-after</code> header.</td></tr>
<tr><td>500, 503 and "overloaded" codes (529 on the Claude API)</td><td>Trouble on the provider's side</td><td>Yes, with backoff.</td></tr>
<tr><td>Timeout or network error</td><td>No response in time</td><td>Yes, a limited number of times.</td></tr>
</tbody></table></div>
<p><mark class="t">Exponential backoff</mark> means waiting longer after each failure: 1 second, then 2, then 4. <mark class="t">Jitter</mark> adds a small random amount to each wait, so thousands of clients that failed together don't all retry at the same instant.</p>
<div class="codebox"><div class="cap">Retry with backoff and jitter</div><pre data-code="backoff"></pre></div>
<p>Also cap the number of attempts and the total time. When everything fails, show a friendly message or switch to a fallback model.</p>
<div data-quiz="c3c"></div>`},
  { t:"Keeping API keys safe", h:`
<ul>
<li>Load keys from environment variables or a secrets manager (Vault, AWS Secrets Manager, Azure Key Vault).</li>
<li>Never commit them. Add <code>.env</code> to <code>.gitignore</code>.</li>
<li><b>Never call the LLM from the React frontend.</b> Anyone can open DevTools and copy the key. The path is always browser → your Spring backend → the provider.</li>
<li>Use separate keys for development and production, set spending limits, and rotate a key immediately if it leaks.</li>
</ul>
<div data-quiz="c3d"></div>`}
  ],
  terms:[["max_tokens","The upper limit on how many tokens the answer may contain."],["stop_reason","Why the model stopped: finished, hit the limit, or wants a tool."],["usage","Token counts for input and output, used to work out cost."],["SSE","Server-sent events: the server pushes small messages over one open HTTP response."],["Time to first token","How long until the first word appears."],["Exponential backoff","Waiting longer after each failed attempt."],["Jitter","Random extra wait so clients don't retry in sync."],["Prompt caching","Reusing a repeated prompt prefix at a lower price."]],
  test:"t3" },

{ id:"ch4", n:4, phase:1, title:"Working with coding agents", mins:30,
  lead:"A coding agent can read your repository, edit files and run commands. It can save hours, and it can also add subtle bugs quickly. This chapter is about getting the first without the second.",
  sections:[
  { t:"Three levels of AI coding help", h:`
<div class="tablewrap"><table>
<thead><tr><th>Level</th><th>What it does</th><th>Who stays in control</th></tr></thead>
<tbody>
<tr><td><b>Autocomplete</b></td><td>Suggests the next line or block as you type</td><td>You, line by line</td></tr>
<tr><td><b>Chat assistant</b></td><td>Answers questions and suggests code you copy in</td><td>You, snippet by snippet</td></tr>
<tr><td><b>Coding agent</b></td><td>Takes a goal, reads files, edits many files, runs builds and tests, and repeats until done</td><td>The agent works; you set the task and review</td></tr>
</tbody></table></div>
<p>Examples of agents include Claude Code, Cursor's agent mode and GitHub Copilot's agent mode. The skills in this chapter apply to all of them.</p>
<div data-quiz="c4a"></div>`},
  { t:"How an agent works", h:`
<p>An agent is an LLM running in a loop with tools: read a file, search the code, edit a file, run a shell command. A typical run looks like this:</p>
<ol>
<li>Read your task.</li>
<li>Explore the repository to find the relevant files.</li>
<li>Make a plan.</li>
<li>Edit the code.</li>
<li>Run the build and tests.</li>
<li>Read the output, fix what failed, and repeat steps 4 to 6.</li>
<li>Report what it did.</li>
</ol>
<p>Everything the agent knows about your project comes from what it reads in the repository and what you tell it. Chapter 9 shows you how to build this kind of loop yourself.</p>`},
  { t:"Writing a good task", h:`
<p>Vague tasks get vague results. A useful template has four parts: <b>Goal</b>, <b>Context</b>, <b>Constraints</b> and <b>Done when</b>.</p>
<div class="codebox"><div class="cap">A well-written task</div><pre data-code="task"></pre></div>
<ul>
<li><b>One task at a time.</b> Several unrelated changes in one go are hard to review.</li>
<li><b>Point to an existing example</b> in your codebase. Agents copy local patterns well.</li>
<li><b>Ask for a plan first</b> on anything bigger than a small fix.</li>
<li><b>Give it a way to check its own work</b>: a test command, a sample request, an expected output.</li>
</ul>
<div data-quiz="c4b"></div>`},
  { t:"Project instruction files", h:`
<p>Most agents read an instruction file from the repository root when they start: <code>CLAUDE.md</code> for Claude Code, <code>AGENTS.md</code> for several other tools, and <code>.github/copilot-instructions.md</code> for Copilot. It saves you repeating the same context in every task.</p>
<div class="codebox"><div class="cap">CLAUDE.md example</div><pre data-code="claudemd"></pre></div>
<p>Keep it short and current: build and test commands, conventions, folders not to touch, and known pitfalls. When the agent repeats a mistake, add a line here.</p>
<div data-quiz="c4c"></div>`},
  { t:"Reviewing the agent's work", h:`
<p>Treat every change like a pull request from a fast but new teammate.</p>
<ul>
<li>Read every line of the diff.</li>
<li>Run the build and tests yourself; don't just trust "all tests pass".</li>
<li>Read the tests too. Were assertions weakened or deleted to make them pass?</li>
<li>Look for scope creep: unrelated files, mass reformatting, renamed things you didn't ask about.</li>
<li>Check new dependencies: does the package exist, is the name exactly right, is it maintained?</li>
<li>Check edge cases: nulls, empty lists, timeouts, concurrent requests.</li>
<li>Check security: input validation, SQL built from strings, secrets in code or logs.</li>
<li>If you can't explain a change, don't merge it.</li>
</ul>`},
  { t:"Strengths and weak spots", h:`
<div class="tablewrap"><table>
<thead><tr><th>Usually good at</th><th>Be careful with</th></tr></thead>
<tbody>
<tr><td>Boilerplate: DTOs, mappers, CRUD endpoints</td><td>Business rules that only live in people's heads</td></tr>
<tr><td>Writing tests for existing code</td><td>Concurrency, transactions and locking</td></tr>
<tr><td>Refactors with clear rules</td><td>Security code: authentication, payments, permissions</td></tr>
<tr><td>Explaining unfamiliar code</td><td>Performance at scale</td></tr>
<tr><td>Upgrade chores and scripts</td><td>Large multi-module changes in one go</td></tr>
</tbody></table></div>`},
  { t:"Working safely", h:`
<ul>
<li>Keep agents away from production credentials and databases.</li>
<li>Work on a branch and commit before each task, so undoing is one command.</li>
<li>Read every command-permission prompt. Never give blanket approval to destructive commands.</li>
<li>Treat what the agent reads, such as issue text and web pages, as untrusted. It can contain injected instructions.</li>
</ul>
<div class="note analogy"><span class="tag">Practice habit</span><p>Give an agent one real task a week and keep a short log of what it got wrong. The log teaches you what to review and how to write better tasks.</p></div>`}
  ],
  terms:[["Coding agent","An LLM in a loop with tools to read, edit and run code."],["Instruction file","A repo file (CLAUDE.md, AGENTS.md) with standing context for the agent."],["Scope creep","Changes beyond what the task asked for."],["Done when","The check that proves a task is finished."]],
  test:"t4" }
];


/* ======================= INLINE CHECKS ======================= */

c2b:{q:`Why wrap a pasted customer email in &lt;email&gt; tags?`,o:[`Tags make the request cheaper`,`So the model can tell the data apart from your instructions`,`The API rejects plain text`,`Tags switch on structured output`],a:1,w:`Delimiters separate instructions from data, let you refer to the data by name, and make injected instructions inside the data less likely to be followed.`},

c4b:{q:`Which task description will give the best result?`,o:[`"Make the exams API better"`,`"Add pagination to GET /api/exams following CandidateController; default 20, max 100; done when ExamControllerTest passes"`,`"Fix everything that looks wrong"`,`"Add pagination, refactor services, upgrade Spring and tidy formatting"`],a:1,w:`It has a clear goal, a local example to follow, constraints and a check for done. The last option bundles too many unrelated changes.`},

const WRITTEN = [
{id:"w1",q:`In 4 to 5 sentences, explain to a junior colleague why an LLM can give a wrong answer with full confidence, and what you do about it.`,m:`<p>An LLM writes by predicting the most likely next token, so it is trained to sound right, not to check facts. When it doesn't know something, a fluent, confident-sounding answer is still the likeliest text, so it rarely says "I don't know". Rare details, such as an obscure config property, are stored weakly and are the most likely to be wrong.</p><p>To reduce this, I give it the facts in the prompt (grounding or RAG), allow it to say it doesn't know, ask it to cite sources, use a low temperature for factual tasks, and verify results with code, tests or the real API.</p>`},

{id:"w3",q:`Describe how your Spring Boot service should call an LLM API reliably: timeouts, retries and what happens when everything fails.`,m:`<p>Reuse one HTTP client with a connect timeout of a few seconds and a request timeout sized to the answer (longer for streaming). Retry only 429, 5xx and network errors, up to 3 or 4 attempts, with exponential backoff (1 s, 2 s, 4 s), random jitter, and the retry-after header respected. Never retry 400, 401 or 413.</p><p>Cap the total time per user request. If all attempts fail, switch to a fallback model or return a clear, friendly error. Log status, latency and token usage for every attempt, and keep the API key in a secrets store.</p>`}
];

{ id:"ch5", n:5, phase:2, title:"Spring AI basics", mins:45,
  lead:"Spring AI lets you build AI features the way you already build Spring services: inject a client, configure it in YAML, and test it like any other bean.",
  sections:[
  { t:"What Spring AI is", h:`
<p><mark class="t">Spring AI</mark> is the Spring project for building AI features. It does for language models what Spring Data does for databases: one consistent Java API in front of many providers, including Anthropic, OpenAI, Google, Amazon Bedrock, Mistral and local models through Ollama.</p>
<p>What you get out of the box:</p>
<ul>
<li><code>ChatClient</code>, a fluent API for prompts, much like <code>RestClient</code>.</li>
<li>Auto-configuration from <code>application.yml</code>.</li>
<li>Answers mapped straight onto Java records.</li>
<li>Streaming with Reactor's <code>Flux</code>.</li>
<li><mark class="t">Advisors</mark> for chat memory and RAG, tool calling, vector stores, MCP, and metrics through Micrometer.</li>
</ul>
<div class="note java"><span class="tag">Versions</span><p>This book uses Spring AI 2.0, released in June 2026, which runs on Spring Boot 4. On a Spring Boot 3 project, use Spring AI 1.1. The ideas are the same, but some names differ: for example, property keys had an extra <code>.options</code> segment. Check the reference docs for the version you use.</p></div>
<div class="tablewrap"><table>
<thead><tr><th>Option</th><th>Best when</th></tr></thead>
<tbody>
<tr><td><b>Spring AI</b></td><td>You are on Spring Boot and want auto-configuration, Spring idioms and observability built in</td></tr>
<tr><td><b>LangChain4j</b></td><td>You want a framework-neutral library (it also supports Quarkus and plain Java), or prefer its "AI service" interface style</td></tr>
<tr><td><b>Raw HTTP</b></td><td>One tiny call, or you need a provider feature no framework supports yet</td></tr>
</tbody></table></div>
<div class="codebox"><div class="cap">For comparison: a LangChain4j "AI service"</div><pre data-code="lc4j"></pre></div>`},
  { t:"Setting up a project", h:`
<p>Add the Spring AI BOM, which keeps all Spring AI versions in step, and one starter for your model provider.</p>
<div class="codebox"><div class="cap">pom.xml</div><pre data-code="pom"></pre></div>
<div class="codebox"><div class="cap">application.yml</div><pre data-code="yml"></pre></div>
<p>To switch providers, you change the starter and these properties. Code that uses <code>ChatClient</code> stays the same. That is the main reason to use the framework.</p>
<div class="note warn"><span class="tag">Watch out</span><p>The key comes from an environment variable. Never paste it into the YAML file that goes into Git.</p></div>
<div data-quiz="c5a"></div>`},
  { t:"ChatClient", h:`
<p>The starter creates a <code>ChatClient.Builder</code> bean. You add defaults, such as a system prompt, and build a client. Each call follows the same pattern: <code>prompt()</code>, then <code>user(...)</code>, then <code>call()</code>, then read the result.</p>
<div class="codebox"><div class="cap">AskController.java</div><pre data-code="chatclient"></pre></div>
<ul>
<li><b>Templates</b>: <code>{topic}</code> placeholders are filled from <code>.param(...)</code>, so you never glue prompts together with <code>+</code>.</li>
<li><b><code>.content()</code></b> returns just the text. <b><code>.chatResponse()</code></b> returns the full response, including token usage and the stop reason.</li>
<li><b>Several clients</b>: you can build more than one, for example a cheap one for classification and a stronger one for answers.</li>
</ul>`},
  { t:"Structured output", h:`
<p>Instead of parsing text yourself, ask Spring AI for a Java type. It builds a JSON schema from your record, adds format instructions to the prompt, and maps the reply back onto the record.</p>
<div class="codebox"><div class="cap">Mapping answers to Java types</div><pre data-code="entity"></pre></div>
<p>The model can still produce something that doesn't fit. Spring AI 2.0 includes a <code>StructuredOutputValidationAdvisor</code> that retries when the reply fails validation. You should still check business rules yourself, such as "severity must be HIGH when payments are affected".</p>
<div data-quiz="c5b"></div>`},
  { t:"Streaming to React", h:`
<p>Call <code>.stream()</code> instead of <code>.call()</code> and you get a <code>Flux&lt;String&gt;</code>: a stream of text pieces. Return it with the <code>text/event-stream</code> media type, and Spring sends it as server-sent events.</p>
<div class="codebox"><div class="cap">Streaming endpoint</div><pre data-code="flux"></pre></div>
<div class="codebox"><div class="cap">Reading it in React</div><pre data-code="react"></pre></div>
<ul>
<li>Spring MVC can return a <code>Flux</code> as long as Project Reactor is on the classpath; you don't need to move the whole app to WebFlux.</li>
<li><code>EventSource</code> only supports GET. For a POST body, use <code>fetch</code> and read <code>response.body</code> as a stream.</li>
<li>Proxies such as nginx may buffer responses and hide the streaming. Turn buffering off for this route.</li>
</ul>`},
  { t:"Chat memory and advisors", h:`
<p>An <mark class="t">advisor</mark> wraps every call to the model, like a servlet filter or a Spring <code>HandlerInterceptor</code>. It can change the request on the way in and read the response on the way out. Chat memory and RAG are both built as advisors.</p>
<p>The memory advisor loads earlier messages for a conversation, adds them to the prompt, and saves the new exchange afterwards. Remember from Chapter 1: the model itself remembers nothing.</p>
<div class="codebox"><div class="cap">Per-user chat memory</div><pre data-code="memory"></pre></div>
<ul>
<li>The <mark class="t">conversation ID</mark> keeps users apart. In Spring AI 2.0 it is required; a missing ID throws an error.</li>
<li>The default repository is in memory, so history disappears on restart and is not shared between instances. In production, use the JDBC repository.</li>
<li><code>maxMessages</code> trims old messages, which controls cost and context size.</li>
</ul>
<div data-quiz="c5c"></div>`},
  { t:"Testing and failure handling", h:`
<p>Put the AI behind your own small interface, then mock that interface in normal tests. Unit tests stay fast, free and repeatable. Checking the model's real answers is the job of the eval suite in Chapter 11.</p>
<div class="codebox"><div class="cap">Mock your own interface, not the model</div><pre data-code="mocktest"></pre></div>
<ul>
<li><b>Retries</b>: Spring AI has built-in retry with backoff for temporary errors, configured under <code>spring.ai.retry</code>.</li>
<li><b>Timeouts</b>: set them on the underlying HTTP client.</li>
<li><b>Fallback</b>: catch failures in your service and return a friendly message or call a second model (Chapter 14).</li>
<li><b>Never assert exact model text</b> in unit tests. It changes from run to run.</li>
</ul>`}
  ],
  terms:[["ChatClient","Spring AI's fluent API for sending prompts and reading answers."],["Starter","A dependency that auto-configures one model provider."],["Advisor","Code that wraps every model call, like a filter; used for memory and RAG."],["Conversation ID","The key that keeps one user's chat history apart from another's."],["entity()","Maps the model's reply onto a Java type."],["Flux","Reactor's stream type; used to stream answers."]],
  test:"t5" },

{ id:"ch6", n:6, phase:2, title:"Tool calling", mins:40,
  lead:"A model can't see your database or press buttons. Tool calling lets it ask your code to do those things, while your code stays in charge.",
  sections:[
  { t:"Why models need tools", h:`
<p>On its own, a model only has its training data and your prompt. It can't:</p>
<ul>
<li>see live data, such as an order's status or today's exam schedule;</li>
<li>take actions, such as creating a ticket or rescheduling an exam;</li>
<li>reliably do exact work like large arithmetic or date calculations.</li>
</ul>
<p>A <mark class="t">tool</mark> is a function you offer the model, described by a name, a description and its parameters. The model decides when a tool would help and with what arguments. Your code runs it.</p>
<div class="note analogy"><span class="tag">Analogy</span><p>The model is a smart colleague on the phone who can't touch your systems. They say "please look up order 1042". You do it and read back the result, and they carry on with the answer.</p></div>`},
  { t:"The round trip", h:`
<div class="flow" aria-label="Tool calling round trip">
<div class="flow-row"><span class="flow-label">One question, two model calls</span>
<span class="fbox">User asks</span><span class="farrow">→</span><span class="fbox">Your app sends question + tool list</span><span class="farrow">→</span><span class="fbox key">Model replies: "call get_order_status"</span><span class="farrow">→</span><span class="fbox">Your code runs the method</span><span class="farrow">→</span><span class="fbox">Your app sends the result back</span><span class="farrow">→</span><span class="fbox">Model writes the final answer</span></div>
</div>
<p>Here is the same round trip in raw JSON. You don't need to write it yourself, but seeing it makes debugging much easier.</p>
<div class="codebox"><div class="cap">1. Request with a tool definition</div><pre data-code="toolreq"></pre></div>
<div class="codebox"><div class="cap">2. The model asks for the tool (no text answer yet)</div><pre data-code="tooluse"></pre></div>
<div class="codebox"><div class="cap">3. You send the result back, then call the model again</div><pre data-code="toolresult"></pre></div>
<p>The key point: <b>the model never runs anything</b>. It only asks. Your code decides whether to run the tool, with which checks, and what result to return.</p>
<div data-quiz="c6a"></div>`},
  { t:"Tools in Spring AI", h:`
<p>Annotate a method with <code>@Tool</code>, describe each parameter with <code>@ToolParam</code>, and pass the object to <code>.tools(...)</code>. Spring AI builds the JSON schema, and its <code>ToolCallingAdvisor</code> runs the whole round trip for you.</p>
<div class="codebox"><div class="cap">OrderTools.java</div><pre data-code="springtool"></pre></div>
<p>Return values are turned into JSON or text for the model. Return a short, useful result; the model reads every token of it.</p>`},
  { t:"Designing good tools", h:`
<p>The model chooses tools by reading their names and descriptions, so write them for a reader who has never seen your code.</p>
<ul>
<li><b>Clear names</b> in verb-noun form: <code>getOrderStatus</code>, <code>searchExamRules</code>.</li>
<li><b>Descriptions that say when to use the tool</b>, not just what it does.</li>
<li><b>Few, simple parameters</b> with examples and allowed values. Use enums where you can.</li>
<li><b>Small, relevant results.</b> Return five lines, not 5,000 rows.</li>
<li><b>Helpful errors.</b> "No order found with ID X" lets the model recover and ask the user; a stack trace doesn't.</li>
<li><b>A focused set.</b> Too many similar tools confuse the model. Spring AI 2.0's tool search advisor can reveal tools gradually when you really have many.</li>
</ul>
<div data-quiz="c6b"></div>`},
  { t:"Keeping tools safe", h:`
<p>The model chooses the arguments, so treat them exactly like input from an anonymous user.</p>
<ul>
<li><b>Validate every argument</b>: format, range, length.</li>
<li><b>Take identity from the server, never from the model.</b> Pass the signed-in user through the tool context, and check permissions inside the tool.</li>
<li><b>Start read-only.</b> Tools that change data need extra care.</li>
<li><b>Confirm before acting.</b> For cancelling, paying or sending, show the user what will happen and wait for their yes.</li>
<li><b>Log every tool call</b> with its arguments and result.</li>
</ul>
<div class="codebox"><div class="cap">Identity through tool context</div><pre data-code="toolctx"></pre></div>
<div data-quiz="c6c"></div>`},
  { t:"Testing tool calling", h:`
<p>Test in two layers:</p>
<ol>
<li><b>The tool methods</b> are plain Java. Unit-test them directly, including invalid IDs and missing data.</li>
<li><b>The model's choices</b> need a small scenario set: for each question, which tool should be called with which arguments, or no tool at all. Run it against the real model whenever prompts or tool descriptions change. Chapter 11 shows how.</li>
</ol>
<p>Include questions that need no tool ("What are your opening hours?" when that's in the system prompt), to check the model doesn't call tools for no reason.</p>`}
  ],
  terms:[["Tool","A function the model may ask your code to run."],["Tool definition","The name, description and parameter schema sent to the model."],["tool_use","The model's request to run a tool with given arguments."],["tool_result","The tool's output, sent back to the model."],["Tool context","Server-side data, such as the user ID, passed to tools without involving the model."]],
  test:"t6" }
);

pgvector: String.raw`CREATE EXTENSION IF NOT EXISTS vector;

CREATE TABLE doc_chunks (
    id         bigserial PRIMARY KEY,
    source     text,              -- file name or URL
    department text,              -- metadata for filtering
    content    text,

-- Approximate nearest-neighbour index for cosine distance

FROM doc_chunks

agentloop: String.raw`// Simplified agent loop; the real types depend on your framework
String runAgent(String goal) {
    List<Message> history = new ArrayList<>(List.of(new UserMessage(goal)));
    BigDecimal spent = BigDecimal.ZERO;

    for (int step = 1; step <= MAX_STEPS; step++) {
        if (spent.compareTo(BUDGET_USD) > 0) return "Stopped: cost budget reached";

        ModelReply reply = model.call(history, tools);          // one LLM call
        spent = spent.add(reply.costUsd());
        log.info("step={} wants={} cost={}", step, reply.summary(), reply.costUsd());

        if (!reply.wantsTool()) return reply.text();            // goal reached

        ToolCall call = reply.toolCall();
        history.add(reply.asMessage());
        if (tools.isRisky(call) && !approvals.confirm(call)) {
            history.add(toolResult(call, "The user declined this action."));
        } else {
            history.add(toolResult(call, tools.run(call)));      // feed the result back
        }
    }
    return "Stopped: step limit reached";
}`,

const RAGFLOW = `<div class="flow" aria-label="RAG pipelines">
<div class="flow-row"><span class="flow-label">Indexing · ahead of time, and again when documents change</span>
<span class="fbox">Load documents</span><span class="farrow">→</span><span class="fbox">Split into chunks</span><span class="farrow">→</span><span class="fbox">Embed each chunk</span><span class="farrow">→</span><span class="fbox key">Store in pgvector</span></div>
<div class="flow-row"><span class="flow-label">Answering · on every question</span>
<span class="fbox">User question</span><span class="farrow">→</span><span class="fbox">Embed the question</span><span class="farrow">→</span><span class="fbox key">Find the most similar chunks</span><span class="farrow">→</span><span class="fbox">Add them to the prompt</span><span class="farrow">→</span><span class="fbox">LLM answers and cites them</span></div>
